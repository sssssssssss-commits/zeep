<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>高铁行程导入</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <main class="wrap">
    <header class="hero">
      <p class="brand">Rail Sync</p>
      <h1>导入订单到手表</h1>
      <p class="sub">截图识别 → 人工校对 → 配对码同步到 Amazfit Active 2</p>
    </header>

    <section class="panel" id="pair-panel">
      <h2>配对码</h2>
      <p class="hint">在 Zepp 小程序设置页输入一次。有效约 15 分钟。</p>
      <p class="code" id="pair-code">------</p>
      <button type="button" id="btn-new-pair">重新生成配对码</button>
    </section>

    <section class="panel">
      <h2>导入方式</h2>
      <div class="row">
        <a class="btn" href="https://www.12306.cn/index/" target="_blank" rel="noopener">打开 12306 官网</a>
        <a class="btn ghost" href="https://mobile.12306.cn/" target="_blank" rel="noopener">打开 12306 手机站</a>
      </div>
      <p class="hint">登录查看订单后截图，再返回本页选择图片。不收集账号密码。</p>
      <label class="file-btn">
        从相册选择订单截图
        <input type="file" id="file" accept="image/*" capture="environment" hidden />
      </label>
      <p class="status" id="ocr-status"></p>
    </section>

    <section class="panel" id="form-panel" hidden>
      <h2>校对行程</h2>
      <form id="trip-form">
        <label>车次 <input name="train_no" required /></label>
        <label>日期 <input name="date" type="date" required /></label>
        <label>出发站 <input name="from_station" required /></label>
        <label>到达站 <input name="to_station" required /></label>
        <label>出发时间 <input name="depart_time" type="time" required /></label>
        <label>到达时间 <input name="arrive_time" type="time" /></label>
        <label>检票口 <input name="gate" /></label>
        <label>车厢 <input name="carriage" /></label>
        <label>座位 <input name="seat" /></label>
        <button type="submit">确认并保存</button>
      </form>
      <pre class="raw" id="raw-text" hidden></pre>
    </section>

    <section class="panel">
      <h2>已确认行程</h2>
      <ul id="trip-list" class="trips"></ul>
      <button type="button" id="btn-refresh" class="ghost">刷新列表</button>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
